<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello World</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
  /* Layout: one centered message on a quiet field, with a small monospace caption beneath. */
  :root {
    --bg: #f3f5f7;
    --fg: #15202b;
    --muted: #5d6b79;
    --accent: #2a5bd7;
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151c;
      --fg: #e8edf2;
      --muted: #8d9aa8;
      --accent: #7ea2ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f151c;
    --fg: #e8edf2;
    --muted: #8d9aa8;
    --accent: #7ea2ff;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 14px system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
    padding-block: 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    place-items: center;
    box-sizing: border-box;
  }
  main {
    min-width: 0;
    max-width: 100%;
    display: grid;
    gap: 16px;
    justify-items: center;
    text-align: center;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2.5rem, 12vw, 5.5rem);
    letter-spacing: -0.02em;
    line-height: 1.05;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }
  h1 span { color: var(--accent); }
  p {
    margin: 0;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>hello<span>wolrd</span></h1>
  <p>Published as a Claude artifact</p>
</main>
</body>
</html>
